name: CI

# What this can and cannot do, up front, because the limit is not obvious.
#
# It CANNOT build the BepInEx plugin. CW4Archipelago.csproj references
# $(GameDir)/BepInEx/interop/Assembly-CSharp.dll and friends - interop assemblies
# BepInEx GENERATES from Creeper World 4's own IL2CPP code. They are derived from
# the game, so a public runner cannot legitimately have them and they must never
# be committed here. The plugin is built on a machine that owns the game.
#
# It CAN check everything that does not need the game, which is more than it
# sounds: the whole rules-and-state layer plus the Archipelago world. Those are
# where the logic lives and where a regression is most likely.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    name: Version is consistent and unshipped
    runs-on: ubuntu-latest
    steps:
      # Tags are needed to tell "this version has already shipped" from "this
      # version is the next one". A shallow checkout has none of them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check the version
        run: |
          set -euo pipefail
          csproj=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' \
            src/CW4Archipelago/CW4Archipelago.csproj | head -1)
          plugin=$(sed -n 's/.*const string Version = "\(.*\)".*/\1/p' \
            src/CW4Archipelago/Plugin.cs | head -1)
          world=$(python3 -c "import json;print(json.load(open('apworld/cw4/archipelago.json'))['world_version'])")
          echo "csproj=$csproj plugin=$plugin world=$world"

          # 1. The three places the version is written must agree - plus the
          #    Archipelago pin, the CHANGELOG section and the dev plugins.
          #    tools/check-release.py owns all of that now; this job keeps only
          #    the tag rule below, which needs git history the checker has no
          #    business reading. The agreement test used to be inline here AND
          #    in package-release.ps1 AND in bump-version.ps1 AND in
          #    post-release-bump.yml - four implementations of one rule.
          python3 tools/check-release.py

          # 2. And it must not be a version that has already SHIPPED. This is
          #    the check package-release.ps1 gained on 2026-09-03 after main sat
          #    four commits past v0.1.2 still calling itself 0.1.2. Doing it here
          #    too moves detection from "whenever someone next packages" to the
          #    push that causes it.
          if git rev-parse "v$csproj" >/dev/null 2>&1; then
            tagged=$(git rev-parse "v$csproj^{commit}")
            head=$(git rev-parse HEAD)
            if [ "$tagged" != "$head" ]; then
              echo "::error::v$csproj is already tagged at $tagged but HEAD is $head - bump the version in all three files"
              exit 1
            fi
            echo "v$csproj is the tagged release commit"
          else
            echo "v$csproj has not shipped yet"
          fi

  core:
    name: Core rules and state (no game required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # No GameDir.props and no game installed: this project is pure C# on
      # purpose, and that property is worth protecting. If someone adds a Unity
      # reference to Core, this job is what fails.
      - name: Build
        run: dotnet build src/CW4Archipelago.Core/CW4Archipelago.Core.csproj -c Release
      - name: Test
        run: dotnet test src/CW4Archipelago.Core.Tests/CW4Archipelago.Core.Tests.csproj -c Release --verbosity normal

  apworld:
    name: Archipelago world
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The world's tests run inside an Archipelago checkout, the same way they
      # do locally via tools/ap-sync.ps1. Pinned to the world's declared minimum
      # so CI tests what the world claims to support, not whatever is on main.
      #
      # This pin caught its own bug on the first run: the world declared 0.6.8,
      # which is not released - the newest Archipelago tag is 0.6.7, and the local
      # dev clone simply reports 0.6.8 because it tracks main. A minimum nobody
      # can install would have told every player to go and get something that does
      # not exist.
      - name: Check out Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: 0.6.7
          path: Archipelago

      - name: Install Archipelago requirements
        working-directory: Archipelago
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync the world into the checkout
        run: cp -r apworld/cw4 Archipelago/worlds/cw4

      - name: Test
        working-directory: Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: '1'
        run: python -m unittest discover -s worlds/cw4/test -t .

      # A generated seed is the check the unit tests cannot make: it exercises
      # fill, which is where an item/location count mismatch or an unreachable
      # location actually surfaces.
      - name: Generate a seed
        working-directory: Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: '1'
        run: |
          mkdir -p Players
          printf 'name: CITester\ngame: Creeper World 4\nCreeper World 4: {}\n' > Players/cw4.yaml
          python Generate.py --player_files_path Players --outputpath out --seed 1

      # The SPAN Experiments change the location SET and the mission count, and
      # they are drawn per seed, so the default run above never touches that
      # path. Three seeds rather than one because the roster is random: a single
      # seed would only exercise whichever 19 missions it happened to draw.
      - name: Generate a seed with the SPAN Experiments on
        working-directory: Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: '1'
        run: |
          mkdir -p SpanPlayers
          printf 'name: CISpan\ngame: Creeper World 4\nCreeper World 4:\n  span_missions: 1\n' > SpanPlayers/cw4span.yaml
          for seed in 1 2 3; do
            python Generate.py --player_files_path SpanPlayers --outputpath spanout --seed $seed
          done

      # A generated file that is stale is worse than no generated file: the two
      # sides of the wire silently disagree about what a mission is called, and
      # a check goes to a location the server never heard of. Re-run the
      # generator and fail if it moved.
      - name: SpanMissionTable.g.cs is up to date
        run: |
          python tools/gen-spancsharp.py
          git diff --exit-code src/CW4Archipelago.Core/SpanMissionTable.g.cs

      # BUILD IT THE WAY THE RELEASE DOES, not with `zip -r`.
      #
      # This used to be `zip -r ../cw4.apworld cw4 -x '*/__pycache__/*'`, chosen
      # to avoid depending on an Archipelago internal. The cost was that CI's
      # artifact was not the released artifact: tools/package-release.ps1 uses
      # Archipelago's own "Build APWorlds", which honours data/GLOBAL.apignore
      # plus the world's own .apignore and rewrites the manifest. The `zip` line
      # hand-reimplemented exactly one rule of that file and silently dropped the
      # rest, so a divergence between the two packagers could never be caught -
      # and the world-local .apignore that keeps 41 percent of test code out of
      # the artifact would have been honoured by the real builder and ignored
      # here.
      #
      # It is safe headless: the builder ends in open_folder(), which on Linux
      # with no xdg-open/gnome-open/kde-open logs a warning and returns.
      - name: Build cw4.apworld the way a release does
        working-directory: Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: '1'
        run: python Launcher.py "Build APWorlds" -- "Creeper World 4"

      # And assert on the built file. Nothing used to: the old step ran
      # `unzip -l`, which prints and exits 0.
      - name: The release is consistent, and the artifact is what it claims
        run: |
          python tools/check-release.py \
            --apworld Archipelago/build/apworlds/cw4.apworld

      - uses: actions/upload-artifact@v4
        with:
          name: cw4-apworld
          path: Archipelago/build/apworlds/cw4.apworld

  compliance:
    name: Archipelago world compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Archipelago's OWN generic world tests: the closest thing it has to a
      # spec compliance check, run on every world. Nothing here ran them until
      # 2026-09-06, and the first run found a real violation.
      - name: Check out Archipelago
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: 0.6.7
          path: Archipelago

      - name: Install Archipelago requirements
        working-directory: Archipelago
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync the world into the checkout
        run: cp -r apworld/cw4 Archipelago/worlds/cw4

      # AP_TEST_WORLDS would load only our world, but it does not exist in
      # 0.6.7. Deleting the others from THIS checkout is the equivalent, and it
      # is why the compliance run has a job to itself: the deletion happens in a
      # throwaway tree and cannot leak into generation or the fill sweep, which
      # need the real world list. Pruning in place beside those steps would be a
      # footgun.
      #
      # Measured for this world: 322 tests in 239s becomes 208 in about one
      # second, and the 114 lost tests were other people's games. Ours keep
      # test_fill, test_ids, test_reachability and test_world_manifest.
      #
      # Keep generic and apquest - they are the suite's fixture worlds, named in
      # worlds/__init__._SUITE_FIXTURE_WORLDS upstream. The _* case spares
      # _bizhawk and _sc2common, which some worlds import.
      #
      # Do NOT swap this for `unittest -k "Creeper World 4"`. It looks identical
      # and is a trap: only the manifest tests generate a class per world, so -k
      # matches 3 tests of 322 and silently skips test_fill, test_ids and
      # test_reachability, which loop over worlds inside the test body.
      - name: Keep only the worlds the suite needs
        working-directory: Archipelago/worlds
        run: |
          for d in */; do
            name="${d%/}"
            case "$name" in
              cw4|generic|apquest|_*) continue ;;
            esac
            rm -rf "$name"
          done
          echo "worlds kept: $(ls -d */ | tr -d '/' | tr '\n' ' ')"

      # The script notices the checkout is pruned and stops attributing failures
      # by game name, so a NAMELESS failure - test_no_failed_world_loads, say -
      # counts as ours, which is the point of pruning. It carries the one known,
      # documented violation as an expected failure, and fails if a new one
      # appears or if the known one silently stops failing.
      - name: World compliance tests
        working-directory: Archipelago
        env:
          SKIP_REQUIREMENTS_UPDATE: '1'
        run: python ../tools/generic-suite.py

  ascii:
    name: ASCII only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This project bans non-ASCII in source, docs and commit messages, for a
      # concrete reason: Python on Windows encodes redirected stdout as cp1252,
      # so one em dash in a print() kills a script, and the same characters are
      # invisible next to a hyphen when pasted into code. Two exceptions are
      # deliberate and are skipped below: box-drawing characters in diagrams, and
      # non-Latin text that IS the data.
      - name: Check for non-ASCII
        run: |
          python3 - <<'PY'
          import pathlib, sys
          # Box-drawing, by CODEPOINT. Writing the glyphs here would put the
          # banned characters into the file that bans them - and this file is
          # a .yml, so the check would fail itself.
          ALLOW = {0x2500, 0x2502, 0x250C, 0x2510, 0x2514, 0x2518,
                   0x251C, 0x2524, 0x252C, 0x2534, 0x253C}
          EXTS = {".cs", ".py", ".md", ".sh", ".ps1", ".yml", ".yaml", ".json", ".csproj"}
          SKIP = {"Archipelago", ".git", "bin", "obj", "__pycache__", "dist"}
          bad = []
          for p in pathlib.Path(".").rglob("*"):
              if any(part in SKIP for part in p.parts) or p.suffix not in EXTS:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  for ch in line:
                      if ord(ch) > 127 and ord(ch) not in ALLOW:
                          bad.append(f"{p}:{n}: U+{ord(ch):04X}")
                          break
          for b in bad:
              print(b)
          print(f"{len(bad)} non-ASCII lines")
          sys.exit(1 if bad else 0)
          PY

  docs:
    name: Docs and comments do not lie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # An audit on 2026-09-17 found that nothing in this repo validates a single
      # .md file or a single comment. docs/randomizer-logic.md is the one
      # document that cannot lie, because logictable.py regenerates it from
      # rules.py; everything else passed CI, compliance and the release gate no
      # matter what it claimed. What that allowed, all of it live at the time:
      # three wrong option defaults on the page a player reads before generating,
      # five comments citing tests BY NAME that have never existed, and sixteen
      # C# members documented with a summary belonging to some other member.
      #
      # Every rule in the checker was proved to FAIL on a deliberately broken
      # tree before being trusted - two of the six did not, and were fixed
      # rather than shipped green.
      #
      # No Archipelago clone and no game: this reads the working tree only, so
      # it is the cheapest job here and runs on every push.
      - name: Check the documentation and comments
        run: python3 tools/check-docs.py

      # CI HAS NEVER READ A SHELL SCRIPT. Before this, the only mention of .sh
      # anywhere in the workflow was an extension in the ASCII checker's list -
      # so "green" was a statement about zero of the 24 harnesses, and a typo in
      # one sat undetected until somebody ran it against the game minutes into a
      # session. None of them can be RUN here (they drive Creeper World 4), but
      # parsing them is free and catches the whole class of error a conversion
      # like tools/lib.sh can introduce.
      - name: The harnesses at least parse
        run: |
          set -euo pipefail
          bash -n tools/*.sh
          echo "parsed $(ls tools/*.sh | wc -l) shell file(s)"

      # tools/lib.sh holds the one copy of the game path and the repo root. Both
      # were previously written out in every harness, and a wrong repo root does
      # not fail - it writes output somewhere else. Assert the library resolves
      # to this checkout, and that every harness actually uses it.
      - name: The harness library resolves, and every harness sources it
        run: |
          set -euo pipefail
          . tools/lib.sh
          [ "$REPO" = "$GITHUB_WORKSPACE" ] || {
            echo "lib.sh REPO=$REPO, expected $GITHUB_WORKSPACE" >&2; exit 1; }
          [ "${AP_CMD##*/}" = "cw4ap-commands.txt" ] || { echo "AP_CMD wrong" >&2; exit 1; }
          [ "${DEV_CMD##*/}" = "cw4dev-commands.txt" ] || { echo "DEV_CMD wrong" >&2; exit 1; }
          missing=0
          for f in tools/*.sh; do
            [ "$(basename "$f")" = "lib.sh" ] && continue
            grep -q '^\. "\$(dirname' "$f" || { echo "does not source lib.sh: $f" >&2; missing=1; }
            grep -q 'G:/Games/Steam' "$f" && { echo "still hard-codes the game path: $f" >&2; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          echo "lib.sh resolved REPO=$REPO; all harnesses source it and none hard-codes a path"
